<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Stats preview card component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>

    /* General Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #090b1a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: row;
      background-color: #1c1938;
      border-radius: 10px;
      overflow: hidden;
      max-width: 1000px;
      width: 100%;
    }

    /* Left Panel Styles */
    .content-card {
      flex: 1;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;
      color: white;
    }

    .title span {
      color: #ab5cdb;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.75);
    }

    /* Stats Section */
    .items-card{
      display: inline-flex;
      text-align: center;
    }    
    .companies, .templates, .queries {
      margin-right: 20px;
      margin-top: 20px;
      font-weight: 700;
      color: white;
      text-transform: uppercase;
    }

    /* Right Panel Styles */
    .image-card {
      flex: 1;
      background: url('./images/image-header-desktop.jpg') no-repeat center center/cover;
      position: relative;
    }

    .image-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(170, 92, 219, 0.5);
    }

    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .container {
          flex-direction: column;
          text-align: center;
      }
      .result-card {
          padding: 30px;
      }
      .image-card {
          height: 250px;
      }
    }

  </style>
</head>
<body>
  <div class="container">
    <!-- Left Panel - content-->
    <div class="content-card">
        <h1 class="title">Get <span>insights</span> that help your business grow.</h1>
        <p>
            Discover the benefits of data analytics and make better decisions regarding revenue, customer 
            experience, and overall efficiency.
        </p>
        <div class="items-card">
          <div class="companies">
            <p>10k+ 
              <span>companies</span>
            </p>
          </div>
          <div class="templates">
              <p>
                314 
                <span>templates</span>

              </p>
          </div>
          <div class="queries">
              <p>
                12m+ 
                <span>queries</span>
              </p>
          </div>
        </div>
    </div>

    <!-- Right Panel - image -->
    <div class="image-card">
        <img src="./images/image-header-desktop.jpg" alt="header image desktop size">
    </div>
  </div>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="ttps://github.com/joeyovey">Joeyovey</a>.
  </div>

</body>
</html>
